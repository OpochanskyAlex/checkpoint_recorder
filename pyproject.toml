[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkpoint-recorder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.10,<4",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.0,<26",
    "rapidfuzz>=3.10,<4",
    "pint>=0.24,<1",
    "matplotlib>=3.8,<4",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/checkpoint_recorder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
